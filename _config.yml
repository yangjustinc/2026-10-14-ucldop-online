#------------------------------------------------------------
# Values for this workshop.
#------------------------------------------------------------

# More detailed instructions are available at:
# https://carpentries.github.io/workshop-template/customization/index.html

# This is a self-organised Software Carpentry Mix & Match workshop using
# selected episodes from the R and Python Gapminder lessons.
carpentry: "swc"
curriculum: "swc-gapminder"

# The workshop mixes both R and Python. The template requires a single flavour
# for its standard Software Carpentry machinery, so R is used here while the
# workshop page provides a custom schedule and explicit setup instructions for
# both languages.
flavor: "r"

pilot: false

title: "Reproducible Data Analysis for Mental Health Research"

#------------------------------------------------------------
# Generic settings.
#------------------------------------------------------------

kind: "workshop"
repository: <USERNAME>/<PROJECT>
email: "team@carpentries.org"

# Sites.
amy_site: "https://amy.carpentries.org"
carpentries_github: "https://github.com/carpentries"
carpentries_pages: "https://carpentries.github.io"
carpentries_site: "https://carpentries.org/"
dc_site: "https://datacarpentry.org"
example_repo: "https://github.com/carpentries/lesson-example"
example_site: "https://carpentries.github.io/lesson-example"
incubator: "https://carpentries-incubator.org/"
lc_site: "https://librarycarpentry.org/"
swc_github: "https://github.com/swcarpentry"
swc_pages: "https://swcarpentry.github.io"
swc_site: "https://software-carpentry.org"
hpcc_github: "https://github.com/hpc-carpentry"
hpcc_pages: "https://hpc-carpentry.github.io"
hpcc_site: "https://hpc-carpentry.org"
template_repo: "https://github.com/carpentries/styles"
training_site: "https://carpentries.github.io/instructor-training"
workshop_repo: "https://github.com/carpentries/workshop-template"
workshop_site: "https://carpentries.github.io/workshop-template"
cc_by_human: "https://creativecommons.org/licenses/by/4.0/"

# Surveys.
pre_survey: "https://carpentries.typeform.com/to/wi32rS?slug="
post_survey: "https://carpentries.typeform.com/to/UgVdRQ?slug="
hpcc_pre_survey: "https://carpentries.typeform.com/to/B1ODiMAi?slug="
hpcc_post_survey: "https://carpentries.typeform.com/to/UVy0uF8B?slug="

# 09:30 local time, in minutes after midnight.
start_time: 570

collections:
  extras:
    output: true
    permalink: /:path/index.html

defaults:
  - values:
      root: .
      layout: page
  - scope:
      path: ""
      type: extras
    values:
      root: ..
      layout: page

exclude:
  - Makefile
  - bin/
  - .Rproj.user/
  - .vendor/
  - vendor/
  - .docker-vendor/

highlighter: rouge

official_curricula:
  - swc
  - dc
  - lc
  - hpcc
